name: Build iOS IPA

on:
  workflow_dispatch: {}

defaults:
  run:
    working-directory: iOS版

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned app
        run: |
          set -o pipefail
          xcodebuild -project NoiseAlert.xcodeproj \
            -scheme NoiseAlert \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build | tail -n 20

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/NoiseAlert.app Payload/
          cd Payload && zip -r ../NoiseAlert.ipa NoiseAlert.app && cd ..
          ls -lh NoiseAlert.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: NoiseAlert-ipa
          path: iOS版/NoiseAlert.ipa
