name: Build iOS IPA

on:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: cd iOS版 && xcodegen generate

      - name: Build unsigned app
        run: |
          set -o pipefail
          cd iOS版
          xcodebuild \
            -project NoiseAlert.xcodeproj \
            -scheme NoiseAlert \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tail -n 30

      - name: Package IPA
        run: |
          set -e
          cd "$GITHUB_WORKSPACE/iOS版"
          APP="build/Build/Products/Release-iphoneos/NoiseAlert.app"
          if [ ! -d "$APP" ]; then
            echo "ERROR: .app 未找到 -> $APP"
            echo "---- build 目录结构 ----"
            find build -name "*.app" -maxdepth 8 2>/dev/null | head -n 20 || true
            exit 1
          fi
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP" Payload/
          # 关键：压缩时顶层必须是 Payload/，否则 Sideloadly 无法解包
          zip -r "$GITHUB_WORKSPACE/NoiseAlert.ipa" Payload
          echo "== IPA 顶层结构（必须包含 Payload/）=="
          unzip -l "$GITHUB_WORKSPACE/NoiseAlert.ipa" | head -n 8
          ls -lh "$GITHUB_WORKSPACE/NoiseAlert.ipa"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: NoiseAlert-ipa
          path: NoiseAlert.ipa
          if-no-files-found: error
